[package]
name = "vocalcord-ws-client"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Rust WebSocket subscriber for the Vocal Cord push channel. Mirrors @vocalcord/sdk's WS layer (Sec-WebSocket-Protocol bearer, exponential backoff to 30s, 4-min ping)."

[dependencies]
push-core.workspace = true

tokio = { workspace = true }
tokio-tungstenite.workspace = true
futures-util.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
